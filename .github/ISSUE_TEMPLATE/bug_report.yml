name: Signaler un bug
description: Décrire un problème reproductible dans Créateur d’AO
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Merci de décrire le problème avec un exemple anonymisé. Ne joignez aucune donnée métier, aucun vrai chemin réseau interne, aucun secret ni aucune base de production.
  - type: textarea
    id: observed
    attributes:
      label: Comportement observé
      description: Que se passe-t-il ?
      placeholder: Décrivez précisément le problème.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Comportement attendu
      description: Que devrait-il se passer à la place ?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Étapes pour reproduire
      placeholder: |
        1. Ouvrir…
        2. Cliquer sur…
        3. Observer…
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: Mode d’utilisation
      options:
        - Installation Windows locale
        - Distribution depuis un partage réseau
        - Développement local
        - Autre
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Version de Windows
      placeholder: Windows 11 64 bits
  - type: textarea
    id: logs
    attributes:
      label: Message d’erreur ou contexte technique
      description: Collez uniquement les éléments anonymisés utiles au diagnostic.
      render: text
