name: Windows build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Validate
        run: npm run check

      - name: Build Windows executables
        run: npm run dist:win

      - name: Prepare server distribution
        shell: powershell
        run: |
          $serverRoot = "release/server-package"
          $appRoot = "$serverRoot/Createur-AO-win-x64"
          Remove-Item $serverRoot -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $appRoot -Force | Out-Null
          Copy-Item "release/win-unpacked/*" $appRoot -Recurse -Force
          Copy-Item "windows/Lancer-Createur-AO.cmd" $serverRoot -Force
          Compress-Archive -Path "$serverRoot/*" -DestinationPath "release/Createur-AO-Serveur.zip" -Force

      - name: Generate SHA-256 checksums
        shell: powershell
        run: |
          $files = @(
            "release/Createur-AO-portable.exe",
            "release/Createur-AO-Setup.exe",
            "release/Createur-AO-Serveur.zip"
          )
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
            "$hash  $([System.IO.Path]::GetFileName($file))"
          }
          $lines | Set-Content "release/SHA256SUMS.txt" -Encoding ascii

      - name: Upload Windows builds
        uses: actions/upload-artifact@v4
        with:
          name: Createur-AO-Windows
          if-no-files-found: error
          retention-days: 30
          path: |
            release/Createur-AO-portable.exe
            release/Createur-AO-Setup.exe
            release/Createur-AO-Serveur.zip
            release/SHA256SUMS.txt
