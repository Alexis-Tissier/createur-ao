name: Apply v0.4.1 beta 5 feedback

on:
  push:
    branches: [main]
    paths:
      - 'scripts/hotfix_v041_beta5.py'
      - 'scripts/hotfix_v041_beta5_testfix.py'
      - '.github/workflows/hotfix-v041-beta5.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply feedback changes
        run: |
          python3 scripts/hotfix_v041_beta5.py
          python3 scripts/hotfix_v041_beta5_testfix.py
      - name: Install dependencies
        run: npm ci
      - name: Validate
        run: npm run check
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server-v4.mjs src/AppV4.jsx tests/workflow-v4.test.mjs package.json
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "perf: make AO status scan direct and stable"
          git push
