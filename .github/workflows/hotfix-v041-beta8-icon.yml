name: Apply v0.4.1 beta 8 icon fix

on:
  push:
    branches: [main]
    paths:
      - 'scripts/hotfix_v041_beta8_icon_asset.py'
      - '.github/workflows/hotfix-v041-beta8-icon.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply icon asset fix
        run: python3 scripts/hotfix_v041_beta8_icon_asset.py
      - name: Install dependencies
        run: npm ci
      - name: Validate and build
        run: npm run check
      - name: Verify the real PNG reached dist
        run: |
          test -f public/app-icon.png
          test -f dist/app-icon.png
          python3 - <<'PY'
          from pathlib import Path
          sig = b'\x89PNG\r\n\x1a\n'
          for name in ('public/app-icon.png', 'dist/app-icon.png'):
              data = Path(name).read_bytes()
              assert data.startswith(sig), f'{name} is not a PNG'
              assert len(data) > 1000, f'{name} is unexpectedly small'
              print(name, len(data), 'bytes OK')
          PY
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/AppV4.jsx scripts/prepare-icon.mjs package.json
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "fix: ship app logo as a real PNG asset"
          git pull --rebase origin main
          git push origin main
