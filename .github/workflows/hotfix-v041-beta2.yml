name: Apply v0.4.1 beta 2 feedback

on:
  push:
    branches: [main]
    paths:
      - 'scripts/hotfix_v041_beta2.py'
      - '.github/workflows/hotfix-v041-beta2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply feedback changes
        run: python3 scripts/hotfix_v041_beta2.py
      - name: Install dependencies
        run: npm ci
      - name: Validate
        run: npm run check
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/AppV4.jsx src/styles-v4.css server-v4.mjs desktop/main.cjs desktop/preload.cjs tests/workflow-v4.test.mjs package.json package-lock.json CHANGELOG.md
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "feat: improve AO tracking safety and readability"
            git push
          fi
