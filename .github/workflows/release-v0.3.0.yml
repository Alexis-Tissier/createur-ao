name: Publish v0.3.0 release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v0.3.0.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Download validated Windows build
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Path release -Force | Out-Null
          gh run download 31181267392 `
            --repo "${{ github.repository }}" `
            --name "Createur-AO-Windows" `
            --dir release
          Rename-Item "release/Createur-AO-Serveur.zip" "Createur-AO-Serveur-v0.3.0.zip" -Force
          Rename-Item "release/SHA256SUMS.txt" "SHA256SUMS-v0.3.0.txt" -Force

      - name: Publish GitHub Release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          @"
          Créateur d'AO v0.3.0

          Première distribution Windows de l'application.

          Fichiers :
          - Createur-AO-Setup.exe : installation utilisateur sans droits administrateur
          - Createur-AO-portable.exe : version portable
          - Createur-AO-Serveur-v0.3.0.zip : distribution recommandée depuis un partage réseau
          - SHA256SUMS-v0.3.0.txt : empreintes SHA-256
          "@ | Set-Content release/RELEASE_NOTES.md -Encoding utf8

          gh release create v0.3.0 `
            "release/Createur-AO-Setup.exe" `
            "release/Createur-AO-portable.exe" `
            "release/Createur-AO-Serveur-v0.3.0.zip" `
            "release/SHA256SUMS-v0.3.0.txt" `
            --target "${{ github.sha }}" `
            --title "Créateur d'AO v0.3.0" `
            --notes-file "release/RELEASE_NOTES.md" `
            --repo "${{ github.repository }}"
