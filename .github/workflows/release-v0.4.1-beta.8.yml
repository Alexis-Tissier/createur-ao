name: Release v0.4.1-beta.8

on:
  push:
    branches: [main]
    paths:
      - 'src/AppV4.jsx'
      - 'scripts/prepare-icon.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify version
        shell: bash
        run: node -e "const p=require('./package.json'); if(p.version!=='0.4.1-beta.8') process.exit(1)"
      - name: Install dependencies
        run: npm ci
      - name: Validate
        run: npm run check
      - name: Verify packaged web icon exists
        shell: bash
        run: test -f dist/app-icon.png
      - name: Build NSIS setup with fixed icon asset
        run: npx electron-builder --win nsis --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: createur-ao-v0.4.1-beta.8
          path: release/Createur-AO-Setup.exe

  publish:
    needs: build-windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: createur-ao-v0.4.1-beta.8
          path: release
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.4.1-beta.8 release/Createur-AO-Setup.exe \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Créateur d'AO v0.4.1 beta 8" \
            --notes "Correction robuste du logo : le PNG est désormais généré comme vrai fichier public/app-icon.png puis copié par Vite dans dist/app-icon.png. L'interface ne dépend plus d'une data URL base64. Le même visuel reste utilisé pour l'icône Windows."
