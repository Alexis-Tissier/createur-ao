name: Apply v0.4.1 beta 3 feedback

on:
  push:
    branches: [main]
    paths:
      - 'scripts/hotfix_v041_beta3.py'
      - '.github/workflows/hotfix-v041-beta3.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply feedback changes
        run: python3 scripts/hotfix_v041_beta3.py
      - name: Install dependencies
        run: npm ci
      - name: Validate
        run: npm run check
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/AppV4.jsx src/styles-v4.css server-v4.mjs desktop/main.cjs tests/workflow-v4.test.mjs package.json package-lock.json CHANGELOG.md
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "feat: add AO price tracking and stronger missing detection"
          git pull --rebase origin main
          git push origin HEAD:main
