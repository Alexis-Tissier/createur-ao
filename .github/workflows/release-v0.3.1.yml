name: Publish v0.3.1 release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v0.3.1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Validate
        run: npm run check

      - name: Build Windows executables
        run: npm run dist:win

      - name: Prepare server distribution
        shell: powershell
        run: |
          $serverRoot = "release/server-package"
          $appRoot = "$serverRoot/Createur-AO-win-x64"
          Remove-Item $serverRoot -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $appRoot -Force | Out-Null
          Copy-Item "release/win-unpacked/*" $appRoot -Recurse -Force
          Copy-Item "windows/Lancer-Createur-AO.cmd" $serverRoot -Force
          Compress-Archive -Path "$serverRoot/*" -DestinationPath "release/Createur-AO-Serveur-v0.3.1.zip" -Force

      - name: Generate SHA-256 checksums
        shell: powershell
        run: |
          $files = @(
            "release/Createur-AO-portable.exe",
            "release/Createur-AO-Setup.exe",
            "release/Createur-AO-Serveur-v0.3.1.zip"
          )
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
            "$hash  $([System.IO.Path]::GetFileName($file))"
          }
          $lines | Set-Content "release/SHA256SUMS-v0.3.1.txt" -Encoding ascii

      - name: Publish GitHub Release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          @"
          Créateur d'AO v0.3.1

          Correctif Windows : démarrage du service interne dans l'application installée.
          Aucun Node.js externe n'est nécessaire.

          Fichiers :
          - Createur-AO-Setup.exe : installation utilisateur sans droits administrateur
          - Createur-AO-portable.exe : version portable
          - Createur-AO-Serveur-v0.3.1.zip : distribution depuis un partage réseau
          - SHA256SUMS-v0.3.1.txt : empreintes SHA-256
          "@ | Set-Content release/RELEASE_NOTES.md -Encoding utf8

          gh release create v0.3.1 `
            "release/Createur-AO-Setup.exe" `
            "release/Createur-AO-portable.exe" `
            "release/Createur-AO-Serveur-v0.3.1.zip" `
            "release/SHA256SUMS-v0.3.1.txt" `
            --target "${{ github.sha }}" `
            --title "Créateur d'AO v0.3.1" `
            --notes-file "release/RELEASE_NOTES.md" `
            --repo "${{ github.repository }}"
