name: Clean v0.3.1 release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v0.3.1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clean-release:
    runs-on: ubuntu-latest
    steps:
      - name: Simplify GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit v0.3.1 \
            --repo "${{ github.repository }}" \
            --title "Créateur d'AO v0.3.1" \
            --notes ""

          gh release delete-asset v0.3.1 Createur-AO-portable.exe --yes --repo "${{ github.repository }}" || true
          gh release delete-asset v0.3.1 Createur-AO-Serveur-v0.3.1.zip --yes --repo "${{ github.repository }}" || true
          gh release delete-asset v0.3.1 SHA256SUMS-v0.3.1.txt --yes --repo "${{ github.repository }}" || true
