name: Apply v0.4.1 beta 10 Windows icon fix

on:
  push:
    branches: [main]
    paths:
      - 'scripts/hotfix_v041_beta10_windows_icon.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply beta10 fix
        run: python3 scripts/hotfix_v041_beta10_windows_icon.py
      - name: Install dependencies
        run: npm ci
      - name: Validate
        run: npm run check
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json desktop/main.cjs
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "fix: use PNG for native Windows app icon"
          git pull --rebase origin main
          git push origin main
