name: Release v0.4.1-beta.10

on:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - '.github/workflows/release-v0.4.1-beta.10.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify version
        shell: bash
        run: node -e "const p=require('./package.json'); if(p.version!=='0.4.1-beta.10') process.exit(1)"
      - name: Install dependencies
        run: npm ci
      - name: Validate
        run: npm run check
      - name: Build NSIS setup
        run: npx electron-builder --win nsis --x64 --publish never
      - name: Verify embedded Windows icon
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          $exe = (Resolve-Path 'release/win-unpacked/Createur-AO.exe').Path
          $icon = [System.Drawing.Icon]::ExtractAssociatedIcon($exe)
          if ($null -eq $icon) { throw 'Aucune icône embarquée dans Createur-AO.exe' }
          if ($icon.Width -lt 16 -or $icon.Height -lt 16) { throw "Icône embarquée invalide: $($icon.Width)x$($icon.Height)" }
          Write-Host "Icône embarquée détectée: $($icon.Width)x$($icon.Height)"
      - uses: actions/upload-artifact@v4
        with:
          name: createur-ao-v0.4.1-beta.10
          path: release/Createur-AO-Setup.exe

  publish:
    needs: build-windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: createur-ao-v0.4.1-beta.10
          path: release
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.4.1-beta.10 release/Createur-AO-Setup.exe \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Créateur d'AO v0.4.1 beta 10" \
            --notes "Correction de l'icône Windows : suppression de l'ICO artisanal. Electron et electron-builder utilisent désormais directement le PNG 256x256 du nouveau logo, afin que l'icône apparaisse dans la barre de titre, la barre des tâches et l'exécutable Windows."
