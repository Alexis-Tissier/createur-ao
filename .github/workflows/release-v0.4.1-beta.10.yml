name: Release v0.4.1-beta.11

on:
  push:
    branches: [ci/beta11-release]
    paths:
      - 'package.json'
      - 'scripts/generate-windows-icon.py'
      - '.github/workflows/release-v0.4.1-beta.10.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify version
        shell: bash
        run: node -e "const p=require('./package.json'); if(p.version!=='0.4.1-beta.11') process.exit(1)"
      - name: Install dependencies
        run: npm ci
      - name: Install Pillow
        run: python -m pip install pillow
      - name: Patch Electron icon path
        shell: pwsh
        run: |
          $p='desktop/main.cjs'
          $t=Get-Content $p -Raw
          $t=$t.Replace("path.join(process.resourcesPath, 'icon.png')", "path.join(process.resourcesPath, 'icon.ico')")
          $t=$t.Replace("path.join(__dirname, '..', 'build', 'icon.png')", "path.join(__dirname, '..', 'build', 'icon.ico')")
          Set-Content $p $t -Encoding UTF8
      - name: Validate
        run: npm run check
      - name: Generate Windows icon
        run: npm run prepare:windows-icon
      - name: Build NSIS setup
        run: npx electron-builder --win nsis --x64 --publish never
      - name: Verify embedded Windows icon
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          $exe=(Resolve-Path 'release/win-unpacked/Createur-AO.exe').Path
          $icon=[System.Drawing.Icon]::ExtractAssociatedIcon($exe)
          if($null -eq $icon){throw 'Aucune icône embarquée'}
          Write-Host "Icône détectée: $($icon.Width)x$($icon.Height)"
      - uses: actions/upload-artifact@v4
        with:
          name: createur-ao-v0.4.1-beta.11
          path: release/Createur-AO-Setup.exe

  publish:
    needs: build-windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: createur-ao-v0.4.1-beta.11
          path: release
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.4.1-beta.11 release/Createur-AO-Setup.exe \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Créateur d'AO v0.4.1 beta 11" \
            --notes "Icône Windows unifiée avec le logo orange/crème de l'application, via un ICO multi-résolution pour la fenêtre, l'exécutable, Alt+Tab et la barre des tâches."
